<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>খাঁটি ঘর | KHATI GHOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <style>
      :root {
        --bg: #faf8f5;
        --card: #fff;
        --bd: #e7e5e4;
        --pri: #1b4332;
        --acc: #d97706;
        --tx: #1c1917;
        --mu: #57534e;
        --soft: #34d399;
      }
      .dark {
        --bg: #0b120e;
        --card: #131f18;
        --bd: #23382c;
        --pri: #34d399;
        --acc: #f59e0b;
        --tx: #f4f4f5;
        --mu: #a1a1aa;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: "Plus Jakarta Sans", "Hind Siliguri", sans-serif;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      html[lang="bn"] body {
        font-family: "Hind Siliguri", "Plus Jakarta Sans", sans-serif;
      }
      .serif {
        font-family: "Playfair Display", serif;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        transition:
          background-color 0.3s,
          border-color 0.3s;
      }
      .mu {
        color: var(--mu);
      }
      .pri {
        color: var(--pri);
      }
      .acc {
        color: var(--acc);
      }
      .btn {
        background: var(--acc);
        color: #fff;
        font-weight: 600;
        border-radius: 999px;
        padding: 0.65rem 1.4rem;
        transition:
          filter 0.2s,
          transform 0.1s;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn2 {
        border: 1.5px solid var(--pri);
        color: var(--pri);
        font-weight: 600;
        border-radius: 999px;
        padding: 0.65rem 1.4rem;
      }
      .btn2:hover {
        background: var(--pri);
        color: var(--bg);
      }
      .pill {
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
        min-height: 36px;
      }
      .pill.on {
        background: var(--pri);
        color: var(--bg);
        border-color: var(--pri);
      }
      .inp {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 0.6rem;
        padding: 0.6rem 0.8rem;
        color: var(--tx);
      }
      .inp:focus,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .img svg {
        width: 62%;
        height: 86%;
      }
      .ico svg {
        width: 72px;
        height: 54px;
        margin: 0 auto;
      }
      .img {
        background: linear-gradient(135deg, #e8f0ea, #f8ebcf);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        overflow: hidden;
      }
      .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .glass {
        backdrop-filter: blur(12px);
        background: color-mix(in srgb, var(--bg) 80%, transparent);
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal.open {
        display: flex;
      }
      #drawer {
        transition: transform 0.3s;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .brand svg {
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
      }
      .brand .bn {
        display: block;
        font-weight: 700;
        font-size: 1.125rem;
        line-height: 1.1;
        color: var(--pri);
      }
      .brand .en {
        display: block;
        margin-top: 3px;
        font-family: "Playfair Display", serif;
        font-size: 10px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--mu);
      }
      @media (max-width: 400px) {
        .brand svg {
          width: 1.9rem;
          height: 1.9rem;
        }
        .brand .bn {
          font-size: 1rem;
        }
        .brand .en {
          font-size: 8.5px;
          letter-spacing: 0.18em;
        }
      }
      .hp {
        padding: 0.35rem 0.6rem;
      }
      .hero {
        background: linear-gradient(135deg, #e8f0ea, #f8ebcf);
        display: grid;
        grid-template-columns: 1fr 1fr;
        place-items: center;
        gap: 0.25rem;
        padding: 1.25rem;
      }
      .hero svg {
        width: 100%;
        height: auto;
      }
      #mdrawer {
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.3s ease,
          visibility 0s 0.3s;
      }
      #mdrawer.open {
        transform: none;
        visibility: visible;
        transition: transform 0.3s ease;
      }
      #mov {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      #mov.open {
        opacity: 1;
        pointer-events: auto;
      }
      #mdrawer.open #mnav a {
        animation: sl 0.35s both;
      }
      #mdrawer.open #mnav a:nth-child(2) {
        animation-delay: 0.05s;
      }
      #mdrawer.open #mnav a:nth-child(3) {
        animation-delay: 0.1s;
      }
      #mdrawer.open #mnav a:nth-child(4) {
        animation-delay: 0.15s;
      }
      #mdrawer.open #mnav a:nth-child(5) {
        animation-delay: 0.2s;
      }
      #mdrawer.open #mnav a:nth-child(6) {
        animation-delay: 0.25s;
      }
      @keyframes sl {
        from {
          opacity: 0;
          transform: translateX(18px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #mdrawer.open #mnav a {
          animation: none;
        }
      }
      #langBtn span.on {
        background: var(--pri);
        color: var(--bg);
      }
      #langBtn span:nth-child(2),
      #langBtn span:nth-child(4) {
        border-left: 1px solid var(--bd);
      }
      .fade {
        animation: fd 0.25s;
      }
      @keyframes fd {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade {
          animation: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>

      <div class="flex justify-between items-center">
        <span class="brand"

          e.classList.toggle("on", e.dataset.l === lang),
        );
        $("#cOld").textContent = N(COMBO_OLD);
        $("#cNew").textContent = N(COMBO);
      }
      function renderPage() {
        $("#pillars").innerHTML = t("pil")
          .map(
            (p) =>
              `<div class="card rounded-2xl p-5"><div class="text-3xl">${p[0]}</div><h3 class="font-bold mt-3 pri">${p[1]}</h3><p class="mu text-sm mt-1.5 leading-relaxed">${p[2]}</p></div>`,
          )
          .join("");
        $("#grid").innerHTML = PD.map((p, i) => {
          const x = t("P")[i],
            v = p.v[sel[i]];
          return `<article class="card rounded-2xl overflow-hidden flex flex-col"><div class="relative">${imgH(p, "aspect-[4/3]")}<span class="absolute top-2 left-2 text-[11px] rounded-full px-2 py-1 text-white" style="background:var(--pri)">${t("batch")}</span><span class="absolute bottom-2 left-2 text-[11px] rounded-full px-2 py-1 bg-white text-stone-800">${x.t}</span></div>
 <div class="p-4 flex flex-col gap-3 flex-1"><div><h3 class="font-bold leading-snug">${x.n}</h3><p class="text-xs mu mt-1">${t("src")}: ${x.s}</p></div>
 <div class="flex gap-2 flex-wrap">${p.v.map((q, j) => `<button class="pill ${j === sel[i] ? "on" : ""}" onclick="sel[${i}]=${j};renderPage()">${t("W")[q[0]]}</button>`).join("")}</div>
 <p class="text-xs mu -mt-1">💡 ${t("U")[i][sel[i]]}</p><div class="text-2xl font-bold acc">${N(v[1])}</div>
 <div class="flex gap-2 mt-auto"><button class="btn2 flex-1 !px-2 text-sm" onclick="qv(${i})">${t("det")}</button><button class="btn flex-1 !px-2 text-sm" onclick="addItem(${i})">${t("add")}</button></div></div></article>`;
        }).join("");
        $("#sources").innerHTML = t("S")
          .map(
            (s, i) =>
              `<div class="card rounded-2xl p-5 text-center"><div class="ico">${PD[i].e}</div><h3 class="font-bold mt-2 pri">${s[0]}</h3><p class="text-sm mu mt-1">${s[1]}</p></div>`,
          )
          .join("");
        $("#cmp").innerHTML = t("cmp")
          .map(
            (r) =>
              `<tr class="border-t" style="border-color:var(--bd)"><td class="p-4 font-semibold">${r[0]}</td><td class="p-4"><span class="text-emerald-600 font-bold">✓</span> ${r[1]}</td><td class="p-4 mu"><span class="text-red-500 font-bold">✗</span> ${r[2]}</td></tr>`,
          )
          .join("");
        $("#tabs").innerHTML = t("tabs")
          .map(
            (x, i) =>
              `<button class="pill ${i === tab ? "on" : ""}" onclick="tab=${i};renderPage()">${x[0]}</button>`,
          )
          .join("");
        $("#tabBody").innerHTML = `<ol class="space-y-3">${t("tabs")
          [tab][1].map(
            (s, i) =>
              `<li class="flex gap-3"><b class="pri shrink-0">${D(String(i + 1))}.</b><span>${s}</span></li>`,
          )
          .join(
            "",
          )}</ol><span class="inline-block mt-5 text-sm font-semibold rounded-full px-4 py-1.5" style="background:var(--pri);color:var(--bg)">✔ ${t("cert")}</span>`;
        $("#revs").innerHTML = t("revs")
          .map(
            (r) =>
              `<div class="card rounded-2xl p-5"><div class="acc">★★★★★</div><p class="mt-2 text-sm leading-relaxed">${r[2]}</p><p class="mt-3 text-sm font-semibold">${r[0]} <span class="mu font-normal">· ${r[1]}</span></p></div>`,
          )
          .join("");
        $("#faqs").innerHTML = t("faq")
          .map(
            (f) =>
              `<details class="card rounded-xl p-4"><summary class="font-semibold cursor-pointer">${f[0]}</summary><p class="mu text-sm mt-2 leading-relaxed">${f[1]}</p></details>`,
          )
          .join("");
        $("#pays").innerHTML = [
          ["cod", "cod"],
          ["bkash", "bk"],
          ["nagad", "ng"],
        ]
          .map(
            (p) =>
              `<button class="pill ${pay === p[0] ? "on" : ""}" onclick="pay='${p[0]}';renderPage();renderCart()">${t(p[1])}</button>`,
          )
          .join("");
        $("#payBox").classList.toggle("hidden", pay === "cod");
        renderCart();
      }

      function addItem(i) {
        const k = i + "-" + sel[i];
        const f = cart.find((c) => c.k === k);
        f ? f.q++ : cart.push({ k, i, v: sel[i], q: 1 });
        toast(t("added"));
        renderCart();
      }
      $("#addCombo").onclick = () => {
        const f = cart.find((c) => c.k === "combo");
        f ? f.q++ : cart.push({ k: "combo", q: 1 });
        toast(t("added"));
        renderCart();
      };
      function qty(k, d) {
        const c = cart.find((c) => c.k === k);
        c.q += d;
        if (c.q < 1) cart = cart.filter((x) => x !== c);
        renderCart();
      }
      const price = (c) => (c.k === "combo" ? COMBO : PD[c.i].v[c.v][1]);
      const cname = (c) => (c.k === "combo" ? t("comboName") : t("P")[c.i].n);
      const cvar = (c) => (c.k === "combo" ? "" : t("W")[PD[c.i].v[c.v][0]]);
      function calc() {
        const sub = cart.reduce((s, c) => s + price(c) * c.q, 0),
          dis = coupon ? Math.round(sub * 0.1) : 0,
          hasCombo = cart.some((c) => c.k === "combo");
        const free = sub >= 1500 || hasCombo,
          del = free ? 0 : +$("#zone").value;
        return { sub, dis, del, free, tot: sub - dis + del };
      }
      function renderCart() {
        try {
          localStorage.setItem("kg_cart", JSON.stringify({ cart, coupon }));
        } catch (e) {}
        const n = cart.reduce((s, c) => s + c.q, 0);
        $("#badge").textContent = $("#floatN").textContent = D(String(n));
        $("#co").classList.toggle("hidden", !cart.length);
        $("#floatSub").textContent = cart.length ? N(calc().sub) : "";
        $("#items").innerHTML = cart.length
          ? cart
              .map(
                (
                  c,
                ) => `<div class="flex gap-3 items-center card rounded-xl p-2.5"><div class="w-14 h-14 rounded-lg overflow-hidden shrink-0">${c.k === "combo" ? '<div class="img w-full h-full !text-2xl">🎁</div>' : imgH(PD[c.i], "w-full h-full !text-2xl")}</div>
 <div class="flex-1 min-w-0"><div class="text-sm font-semibold leading-snug">${cname(c)}</div><div class="text-xs mu">${cvar(c)} · ${N(price(c))}</div>
 <div class="flex items-center gap-2 mt-1"><button class="pill !py-0 !min-h-0 w-7" onclick="qty('${c.k}',-1)">−</button><b class="text-sm">${D(String(c.q))}</b><button class="pill !py-0 !min-h-0 w-7" onclick="qty('${c.k}',1)">+</button><button class="ml-auto text-red-500 text-sm" onclick="qty('${c.k}',-99)" aria-label="Remove">🗑</button></div></div></div>`,
              )
              .join("")
          : `<p class="mu text-sm py-8 text-center">${t("empty")}</p>`;
        if (!cart.length) return;
        const r = calc();
        $("#eta").textContent = eta();
        $("#fdTxt").textContent = r.free
          ? t("fdOk")
          : t("fdMore")(N(1500 - r.sub));
        $("#fdBar").style.width =
          (r.free ? 100 : Math.min(100, r.sub / 15)) + "%";
        $("#sum").innerHTML =
          `<div class="flex justify-between"><span>${t("sub")}</span><b>${N(r.sub)}</b></div>${r.dis ? `<div class="flex justify-between text-emerald-600"><span>${t("dis")}</span><b>−${N(r.dis)}</b></div>` : ""}<div class="flex justify-between"><span>${t("del")}</span><b>${r.free ? t("free") : N(r.del)}</b></div><div class="flex justify-between text-lg border-t pt-2 mt-1" style="border-color:var(--bd)"><span>${t("tot")}</span><b class="acc">${N(r.tot)}</b></div>`;
      }
      $("#zone").onchange = renderCart;
      $("#applyCp").onclick = () => {
        const ok = $("#coupon").value.trim().toUpperCase() === "KHATI10";
        coupon = ok;
        const m = $("#cpMsg");
        m.textContent = ok ? t("cpOk") : t("cpBad");
        m.style.color = ok ? "#059669" : "#DC2626";
        renderCart();
      };

      function qv(i) {
        const p = PD[i],
          x = t("P")[i],
          q = t("qv");
        $("#qvBody").innerHTML =
          `${imgH(p, "aspect-[16/9] rounded-xl")}<h3 class="text-xl font-bold mt-4 pri">${x.n}</h3><dl class="text-sm mt-3 space-y-2.5"><div><dt class="font-semibold">${q.o}</dt><dd class="mu">${x.s}</dd></div><div><dt class="font-semibold">${q.d}</dt><dd class="mu">${t("batch")}</dd></div><div><dt class="font-semibold">${q.b}</dt><dd class="mu">${x.b}</dd></div><div><dt class="font-semibold">${q.s}</dt><dd class="mu">${x.st}</dd></div></dl><div class="flex gap-2 mt-5"><button class="btn flex-1" onclick="addItem(${i})">${t("add")}</button><button class="btn2" onclick="closeM()">${t("close")}</button></div>`;
        $("#qv").classList.add("open");
      }
      function closeM() {
        $$(".modal").forEach((m) => m.classList.remove("open"));
      }
      $$(".modal").forEach((m) =>
        m.addEventListener("click", (e) => {
          if (e.target === m) closeM();
        }),
      );

      function openCart(o) {
        $("#drawer").style.transform = o ? "translateX(0)" : "";
        $("#ov").classList.toggle("hidden", !o);
      }
      $("#cartBtn").onclick = $("#floatCart").onclick = () => openCart(true);
      $("#closeCart").onclick = $("#ov").onclick = () => openCart(false);
      function mMenu(o) {
        $("#mdrawer").classList.toggle("open", o);
        $("#mov").classList.toggle("open", o);
        document.body.style.overflow = o ? "hidden" : "";
      }
      $("#menuBtn").onclick = () => mMenu(true);
      $("#mClose").onclick = $("#mov").onclick = () => mMenu(false);
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") mMenu(false);
      });
      $$("#mnav a").forEach((a) =>
        a.addEventListener("click", () => mMenu(false)),
      );

      $("#langBtn").onclick = () => {
        lang = lang === "bn" ? "en" : "bn";
        localStorage.setItem("kg_lang", lang);
        applyStatic();
        $("#cpMsg").textContent = t(coupon ? "cpOk" : "cpHint");
        $("#cpMsg").style.color = coupon ? "#059669" : "";
        $("#cbMsg").textContent = "";
        renderPage();
        if ($("#tm").classList.contains("open")) renderTrack();
      };
      $("#themeBtn").onclick = () => {
        dark = !dark;
        document.documentElement.classList.toggle("dark", dark);
        localStorage.setItem("kg_theme", dark ? "dark" : "light");
        $("#themeBtn").textContent = dark ? "☀️" : "🌙";
      };

      $("#confirm").onclick = () => {
        const name = $("#fName").value.trim(),
          ph = $("#fPhone")
            .value.replace(/[\s-]/g, "")
            .replace(/^\+?88/, ""),
          ad = $("#fAddr").value.trim(),
          trx = $("#trx").value.trim();
        const err = !name
          ? "eName"
          : !/^01[3-9]\d{8}$/.test(ph)
            ? "ePhone"
            : !ad
              ? "eAddr"
              : pay !== "cod" && !trx
                ? "eTrx"
                : null;
        if (err) {
          toast(t(err));
          return;
        }
        const g = $("#gift").checked,
          hp = g && $("#hidePrice").checked,
          gm = $("#gMsg").value.trim(),
          r = calc(),
          id = "#KG-" + Math.floor(1000 + Math.random() * 9000),
          payName =
            t(pay === "cod" ? "cod" : pay === "bkash" ? "bk" : "ng") +
            (pay !== "cod" ? ` (TrxID: ${trx})` : "");
        const lines = cart.map(
          (c) =>
            `${cname(c)}${cvar(c) ? " (" + cvar(c) + ")" : ""} × ${D(String(c.q))} = ${N(price(c) * c.q)}`,
        );
        const giftTxt = g
          ? "\n\n🎁 " +
            t("giftYes") +
            (hp ? "\n" + t("hideP") : "") +
            (gm ? "\n" + t("gMsg") + ": " + gm : "")
          : "";
        const msg = `${lang === "bn" ? "নতুন অর্ডার" : "New Order"} ${id}\n\n${lines.join("\n")}\n\n${t("tot")}: ${N(r.tot)}\n${lang === "bn" ? "পেমেন্ট" : "Payment"}: ${payName}\n${lang === "bn" ? "নাম" : "Name"}: ${name}\n${lang === "bn" ? "মোবাইল" : "Mobile"}: ${ph}\n${lang === "bn" ? "ঠিকানা" : "Address"}: ${ad}${giftTxt}`;
        $("#omBody").innerHTML =
          `<h3 class="text-xl font-bold pri">${t("oT")}</h3><p class="mt-2 text-sm">${t("oId")}: <b class="acc">${id}</b></p><ul class="text-sm mt-3 space-y-1 mu">${(hp ? lines.map((l) => l.split(" = ")[0]) : lines).map((l) => `<li>${l}</li>`).join("")}</ul><div class="text-sm mt-3 space-y-1"><div class="flex justify-between"><span>${t("del")}</span><b>${r.free ? t("free") : N(r.del)}</b></div><div class="flex justify-between text-lg"><span>${t("tot")}</span><b class="acc">${N(r.tot)}</b></div><div class="mu">${payName}</div><div class="mu">${esc(name)} · ${ph}<br>${esc(ad)}</div>${g ? `<div class="mu mt-1">🎁 ${t("giftYes")}${hp ? " · " + t("hideP") : ""}${gm ? "<br>“" + esc(gm) + "”" : ""}</div>` : ""}</div><p class="mu text-sm mt-3">${t("oSub")}</p><a target="_blank" rel="noopener" href="https://wa.me/8801711000000?text=${encodeURIComponent(msg)}" class="block text-center text-white font-semibold rounded-full py-3 mt-4" style="background:#25D366">${t("wa")}</a><button class="btn2 w-full mt-2" onclick="closeM()">${t("close")}</button>`;
        saveOrder(id, r.tot, +$("#zone").value);
        cart = [];
        coupon = false;
        $("#gift").checked = false;
        $("#giftBox").classList.add("hidden");
        $("#gMsg").value = "";
        $("#hidePrice").checked = false;
        $("#cpMsg").textContent = t("cpHint");
        $("#cpMsg").style.color = "";
        $("#coupon").value = "";
        ["#fName", "#fPhone", "#fAddr", "#trx"].forEach(
          (s) => ($(s).value = ""),
        );
        openCart(false);
        renderCart();
        $("#om").classList.add("open");
      };

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const okPh = (s) =>
        /^01[3-9]\d{8}$/.test(s.replace(/[\s-]/g, "").replace(/^\+?88/, ""));
      function eta() {
        const z = +$("#zone").value === 70,
          [a, b] = z ? [1, 2] : [2, 4],
          d = (n) => {
            const x = new Date();
            x.setDate(x.getDate() + n);
            return x;
          },
          A = d(a),
          B = d(b),
          bn = lang === "bn",
          f = (x, o) => x.toLocaleDateString(bn ? "bn-BD" : "en-US", o),
          m = bn
            ? { day: "numeric", month: "long" }
            : { month: "short", day: "numeric" };
        return (
          t("eta") +
          (bn && A.getMonth() === B.getMonth()
            ? f(A, { day: "numeric" })
            : f(A, m)) +
          " – " +
          f(B, m)
        );
      }
      $("#gift").onchange = (e) => {
        const b = $("#giftBox");
        if (e.target.checked) {
          b.classList.remove("hidden");
          b.classList.add("fade");
        } else b.classList.add("hidden");
      };
      $("#cbBtn").onclick = () => {
        const v = $("#cbPh").value,
          m = $("#cbMsg"),
          ok = okPh(v);
        m.textContent = t(ok ? "cbOk" : "cbBad");
        m.style.color = ok ? "#059669" : "#DC2626";
        if (ok) {
          try {
            const a = JSON.parse(localStorage.getItem("kg_cb") || "[]");
            a.push({ p: v, d: new Date().toISOString() });
            localStorage.setItem("kg_cb", JSON.stringify(a));
          } catch (e) {}
          $("#cbPh").value = "";
        }
      };
      let lastId = null;
      const orders = () => {
        let s = {};
        try {
          s = JSON.parse(localStorage.getItem("kg_orders")) || {};
        } catch (e) {}
        return {
          "#KG-5924": {
            d: new Date(Date.now() - 864e5).toISOString(),
            t: 1530,
            z: 70,
            s: 2,
          },
          ...s,
        };
      };
      function saveOrder(id, tot, z) {
        const s = orders();
        delete s["#KG-5924"];
        s[id] = { d: new Date().toISOString(), t: tot, z, s: 0 };
        try {
          localStorage.setItem("kg_orders", JSON.stringify(s));
        } catch (e) {}
      }
      function openTrack() {
        lastId = null;
        renderTrack();
        $("#tm").classList.add("open");
      }
      function doTrack() {
        let v = $("#trId").value.trim().toUpperCase().replace(/\s/g, "");
        if (v && v[0] !== "#") v = "#" + v;
        lastId = v;
        renderTrack();
      }
      function renderTrack() {
        let res = "";
        if (lastId !== null) {
          const o = orders()[lastId];
          res = !o
            ? `<p class="mt-4 text-sm text-red-500">${t("trBad")}</p>`
            : `<div class="mt-5"><div class="h-1.5 rounded-full" style="background:var(--bd)"><div class="h-1.5 rounded-full" style="background:var(--acc);width:${(o.s + 1) * 25}%"></div></div>
  <ol class="grid grid-cols-4 mt-3 text-center text-[11px] gap-1">${t("trSteps")
    .map(
      (x, i) =>
        `<li><div class="mx-auto w-8 h-8 rounded-full flex items-center justify-center text-sm" style="${i <= o.s ? "background:var(--pri);color:var(--bg)" : "background:var(--bd)"}">${i <= o.s ? "✓" : D(String(i + 1))}</div><div class="mt-1.5 ${i <= o.s ? "font-semibold" : "mu"}">${x}</div></li>`,
    )
    .join("")}</ol>
  <dl class="text-sm mt-5 space-y-1.5"><div class="flex justify-between"><dt class="mu">${t("oId")}</dt><dd class="font-semibold">${esc(lastId)}</dd></div><div class="flex justify-between"><dt class="mu">${t("trDate")}</dt><dd>${new Date(o.d).toLocaleDateString(lang === "bn" ? "bn-BD" : "en-US", { day: "numeric", month: "long", year: "numeric" })}</dd></div><div class="flex justify-between"><dt class="mu">${t("tot")}</dt><dd class="font-semibold acc">${N(o.t)}</dd></div><div class="flex justify-between"><dt class="mu">${t("trAreaL")}</dt><dd>${t("trArea")[o.z === 70 ? 0 : 1]}</dd></div></dl></div>`;
        }
        $("#tmBody").innerHTML =
          `<div class="flex justify-between items-center"><h3 class="text-xl font-bold pri">${t("trT")}</h3><button class="pill" onclick="closeM()" aria-label="Close">✕</button></div><div class="flex gap-2 mt-4"><input id="trId" class="inp" placeholder="#KG-0000" value="${esc(lastId || "")}" onkeydown="if(event.key==='Enter')doTrack()"><button class="btn" onclick="doTrack()">${t("trBtn")}</button></div><button class="text-xs acc mt-2" onclick="$('#trId').value='#KG-5924';doTrack()">${t("trDemo")} #KG-5924</button>${res}`;
      }
      $$("[data-track]").forEach((a) =>
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openTrack();
        }),
      );
      try {
        const sv = JSON.parse(localStorage.getItem("kg_cart"));
        if (sv) {
          cart = (sv.cart || []).filter(
            (c) =>
              c && (c.k === "combo" || (PD[c.i] && PD[c.i].v[c.v] && c.q > 0)),
          );
          coupon = !!sv.coupon;
          if (coupon) $("#coupon").value = "KHATI10";
        }
      } catch (e) {}
      document.documentElement.classList.toggle("dark", dark);
      $("#heroArt").innerHTML = ART.slice(0, 4).join("");
      applyStatic();
      renderPage();
      if (coupon) {
        $("#cpMsg").textContent = t("cpOk");
        $("#cpMsg").style.color = "#059669";
      }
    </script>
  </body>
</html>
